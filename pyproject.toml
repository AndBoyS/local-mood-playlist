[project]
name = "local-mood-playlist"
version = "0.1.0"
description = "CLI for fixed-vocabulary mood playlists from a local music library."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "audioread>=3.0.1",
    "inquirerpy>=0.3.4",
    "librosa>=1.0.0",
    "mir_eval @ git+https://github.com/mir-evaluation/mir_eval.git@1fed5327e2a65c3294579beafa03a6498b4da3d0",
    "msgspec>=0.22.0",
    "music21==9.3.0",
    "numpy>=2.5.3",
    "PyYAML>=6.0.3",
    "prompt-toolkit>=3.0.53",
    "safetensors>=0.8.0",
    "tomli-w>=1.2.0",
    "torch>=2.14",
    "torchaudio>=2.11",
    "typed-argparse>=0.3.1",
    "zstandard>=0.25.0",
]

[project.scripts]
moodpl = "local_mood_playlist.main:main"

[dependency-groups]
dev = [
    "huggingface-hub>=0.36.2",
    "pyrefly>=1.4.0",
    "pyrefly-torch-stubs>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { pyrefly = "2099-01-01", pyrefly-torch-stubs = "2099-01-01", pyrefly-shape-extensions = "2099-01-01" }
# music21 hard-declares matplotlib, not used by us
exclude-dependencies = ["matplotlib"]

[tool.uv.build-backend]
module-name = "local_mood_playlist"
wheel-exclude = ["**/UPSTREAM.md"]
source-exclude = ["**/music2emo.pyi"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/local_mood_playlist/vendor/**"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W505", # Docstring line too long
  "F",    # Pyflakes
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "I",    # isort
  "ISC",  # implicit string concat
  "PT",   # pytest
  "RET",  # return
  "ERA",  # remove commented code
  "PGH",  # use specific error code for lint ignores
  "PL",   # pylint
  "PERF",
  "FURB",
  "TRY",
  "A005",
  "PLR0917", # Max pos arguments
]
ignore = [
  "E501",   # Line too long
  "ISC001",
  "PLR091", # Uncle Bob's BS
  "PTH123", # open should be replaced by Path.open
  "TRY003", # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.pylint]
max-positional-args = 2

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "PLR2004", "PLR0917", "PT017", "TRY301"]
"scripts/*" = ["E402", "PLW0603", "PLR2004", "PERF401", "UP031", "B905", "SIM102", "FURB192", "PLW0108", "SIM222"]

[tool.pyrefly]
project-excludes = ["src/local_mood_playlist/vendor/**", "scripts/**"]
use-ignore-files = false
output-format = "min-text"
min-severity = "warn"
preset = "strict"

[tool.pyrefly.errors]
unannotated-return = true
invalid-abstract-method = true
unused-call-result = true
empty-body = true
missing-super-call = true
unsupported-dynamic-base = true
implicit-reexport = true
unknown-argument-type = true
unknown-attribute-type = true
implicit-any-lambda = true
untyped-function-decorator = true
untyped-class-decorator = true
unused-type-ignore = true
no-any-return = true
untyped-import = true
open-unpacking = true
not-required-key-access = true
implicitly-defined-attribute = true
implicit-any = true
implicit-bool = true
invalid-cast = true
