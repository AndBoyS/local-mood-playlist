[project]
name = "local-mood-playlist"
version = "0.1.0"
description = "CLI for fixed-vocabulary mood playlists from a local music library."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # --- audioread ---
    "audioread==3.1.0",
    "standard-aifc==3.13.0",
    "standard-sunau==3.13.0",
    "audioop-lts==0.2.2",
    "standard-chunk==3.13.0",
    # --- inquirerpy ---
    "inquirerpy==0.3.4",
    "pfzy==0.3.4",
    "prompt-toolkit==3.0.53",
    "wcwidth==0.9.1",
    # --- librosa ---
    "librosa==1.0.0",
    "decorator==5.3.1",
    "joblib==1.6.0",
    "cloudpickle==3.1.2",
    "lazy-loader==0.6",
    "packaging==26.3",
    "msgpack==1.2.3",
    "numba==0.68.0",
    "llvmlite==0.50.0",
    "pooch==1.9.0",
    "platformdirs==4.12.2",
    "requests==2.34.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.2",
    "idna==3.20",
    "urllib3==2.8.0",
    "scikit-learn==1.9.1",
    "narwhals==2.26.0",
    "scipy==1.18.1",
    "threadpoolctl==3.7.0",
    "soundfile==0.14.0",
    "cffi==2.1.1",
    "pycparser==3.0; implementation_name != 'PyPy'",
    "typing-extensions==4.16.0",
    "soxr==1.1.0",
    # --- mir_eval ---
    "mir_eval @ git+https://github.com/mir-evaluation/mir_eval.git@1fed5327e2a65c3294579beafa03a6498b4da3d0",
    # --- msgspec ---
    "msgspec==0.22.0",
    # --- music21 ---
    "chardet==7.6.0",
    "music21==9.3.0",
    "jsonpickle==4.1.2",
    "more-itertools==11.1.0",
    "webcolors==25.10.0",
    # --- numpy ---
    "numpy==2.5.3",
    # --- PyYAML ---
    "PyYAML==6.0.3",
    # --- safetensors ---
    "safetensors==0.8.0",
    # --- tomli-w ---
    "tomli-w==1.2.0",
    # --- torch ---
    "torch==2.14.1",
    "cuda-bindings==13.4.3; python_full_version < '3.15' and sys_platform == 'linux'",
    "cuda-pathfinder==1.8.2; python_full_version < '3.15' and sys_platform == 'linux'",
    "cuda-toolkit==13.0.3.0; sys_platform == 'linux'",
    "triton==3.8.0; python_full_version < '3.15' and sys_platform == 'linux'",
    "nvidia-cudnn-cu13==9.24.0.43; sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.8.1; sys_platform == 'linux'",
    "nvidia-nccl-cu13==2.30.7; sys_platform == 'linux'",
    "nvidia-nvshmem-cu13==3.4.5; sys_platform == 'linux'",
    "nvidia-cublas==13.1.1.3; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-cuda-cupti==13.0.85; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-cuda-nvrtc==13.0.88; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-cuda-runtime==13.0.96; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-cufft==12.0.0.61; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-cufile==1.15.1.6; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-curand==10.4.0.35; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-cusolver==12.0.4.66; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-cusparse==12.6.3.3; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-nvjitlink==13.4.92; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    "nvidia-nvtx==13.0.85; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'x86_64')",
    # --- torchaudio ---
    "torchaudio==2.11.0",
    # --- typed-argparse ---
    "typed-argparse==0.3.1",
    # --- zstandard ---
    "zstandard==0.25.0",
]

[project.scripts]
moodpl = "local_mood_playlist.main:main"

[dependency-groups]
dev = [
    "huggingface-hub>=0.36.2",
    "pyrefly>=1.4.0",
    "pyrefly-torch-stubs>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"
add-bounds = "exact"
exclude-newer-package = { pyrefly = "2099-01-01", pyrefly-torch-stubs = "2099-01-01", pyrefly-shape-extensions = "2099-01-01" }
# music21 hard-declares matplotlib, not used by us.
# torch hard-declares these; only used by torch.compile / hub / DCP, which we don't touch.
exclude-dependencies = [
    "matplotlib",
    "jinja2",
    "markupsafe",
    "networkx",
    "filelock",
    "fsspec",
    "sympy",
    "mpmath",
    "setuptools",
]

[tool.uv.build-backend]
module-name = "local_mood_playlist"
wheel-exclude = ["**/UPSTREAM.md"]
source-exclude = ["**/music2emo.pyi"]

[tool.ruff]
line-length = 120
extend-exclude = [
    "src/local_mood_playlist/vendor/music2emo.py",
    "src/local_mood_playlist/vendor/model/**",
    "src/local_mood_playlist/vendor/utils/**",
    "src/local_mood_playlist/vendor/inference/**",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle
    "W505",    # Docstring line too long
    "F",       # Pyflakes
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "I",       # isort
    "ISC",     # implicit string concat
    "PT",      # pytest
    "RET",     # return
    "ERA",     # remove commented code
    "PGH",     # use specific error code for lint ignores
    "PL",      # pylint
    "PERF",
    "FURB",
    "TRY",
    "A005",
    "PLR0917", # Max pos arguments
]
ignore = [
    "E501",   # Line too long
    "ISC001",
    "PLR091", # Uncle Bob's BS
    "PTH123", # open should be replaced by Path.open
    "TRY003", # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.pylint]
max-positional-args = 2

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "PLR2004", "PLR0917", "PT017", "TRY301"]
"scripts/*" = [
    "E402",
    "PLW0603",
    "PLR2004",
    "PERF401",
    "UP031",
    "B905",
    "SIM102",
    "FURB192",
    "PLW0108",
    "SIM222",
]

[tool.pyrefly]
project-excludes = [
    "src/local_mood_playlist/vendor/music2emo.py",
    "src/local_mood_playlist/vendor/model/**",
    "src/local_mood_playlist/vendor/utils/**",
    "src/local_mood_playlist/vendor/inference/**",
    "scripts/**",
]
use-ignore-files = false
output-format = "min-text"
min-severity = "warn"
preset = "strict"
search-path = ["tests/model", "scripts"]

[tool.pyrefly.errors]
unannotated-return = true
invalid-abstract-method = true
unused-call-result = true
empty-body = true
missing-super-call = true
unsupported-dynamic-base = true
implicit-reexport = true
unknown-argument-type = true
unknown-attribute-type = true
implicit-any-lambda = true
untyped-function-decorator = true
untyped-class-decorator = true
unused-type-ignore = true
no-any-return = true
untyped-import = true
open-unpacking = true
not-required-key-access = true
implicitly-defined-attribute = true
implicit-any = true
implicit-bool = true
invalid-cast = true

[tool.pytest.ini_options]
pythonpath = ["scripts"]
markers = [
    "model: needs local model assets and compute (MPS/GPU); runs on the Mac, excluded from CI",
    "expects_stderr: test asserts stderr output itself; the autouse quiet-stderr check is skipped",
]
